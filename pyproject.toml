[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sslcommerz-py"
version = "0.1.0"
description = "Typed Python SDK and CLI for the SSLCommerz payment gateway: session init, IPN validation, hash verification, transaction query and refunds."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["sslcommerz", "payment-gateway", "bangladesh", "ipn", "ecommerce", "refund", "sdk", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
flask = ["flask>=2.2"]
fastapi = ["fastapi>=0.100", "python-multipart>=0.0.6"]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/saizul/sslcommerz-py"
Issues = "https://github.com/saizul/sslcommerz-py/issues"
Changelog = "https://github.com/saizul/sslcommerz-py/blob/main/CHANGELOG.md"

[project.scripts]
sslcommerz = "sslcommerz_py.cli:_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sslcommerz_py = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
# Code blocks in Markdown are documentation, aligned for reading.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "S"]
ignore = ["SIM108", "UP006", "UP007", "UP035", "UP045", "RUF022", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S105", "S106"]
"examples/*" = ["S104", "S105", "S201"]
